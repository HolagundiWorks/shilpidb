[package]
name = "shilpi-gui"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/HolagundiWorks/shilpidb"
authors = ["HolagundiWorks"]
description = "ShilpiDB Desktop: a Tauri GUI for browsing and querying a shilpid database — the Compass equivalent."

[lib]
name = "shilpi_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shilpi-protocol = { path = "../../crates/shilpi-protocol" }
shilpidb = { path = "../../crates/shilpidb" }

[lints.rust]
unsafe_code = "forbid"
