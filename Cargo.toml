[workspace]
resolver = "2"
members = [
    "crates/shilpidb",
    "crates/shilpi-protocol",
    "crates/shilpi-client",
    "crates/shilpid",
    "crates/shilpi",
]
# The Tauri GUI (gui/src-tauri) is deliberately its own Cargo workspace, not
# a member of this one: it pulls in tauri/serde/tokio, which would leak into
# every `cargo build --workspace` here even though the storage engine and
# server/shell stay dependency-free. Build it separately (see gui/README.md).
exclude = ["gui/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/HolagundiWorks/shilpidb"
authors = ["HolagundiWorks"]

[workspace.lints.rust]
unsafe_code = "forbid"
