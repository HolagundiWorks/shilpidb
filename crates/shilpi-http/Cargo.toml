[package]
name = "shilpi-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A dependency-free HTTP/JSON gateway in front of shilpid, so non-Rust hosts (e.g. the AORMS TypeScript/Python stack) can reach the spatial store over REST."

[[bin]]
name = "shilpi-http"
path = "src/main.rs"

[dependencies]
shilpidb = { path = "../shilpidb", version = "0.2.0" }
shilpi-client = { path = "../shilpi-client", version = "0.2.0" }

[lints]
workspace = true
