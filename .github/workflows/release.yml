name: Release

# Builds shilpid + shilpi natively for Linux, macOS (x86_64 and arm64), and
# Windows, packages each into an archive, and publishes them to a GitHub
# Release for the pushed tag. Triggered by pushing a `v*` tag:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# (or run manually via workflow_dispatch, using the current commit's version
# as the release tag — handy for testing the workflow without cutting a
# real release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Both macOS targets build on the Apple Silicon runner: GitHub's
          # Intel macOS runner pool (macos-13) has been seeing multi-hour (or
          # indefinite) queue times as it's phased out, while macos-14 stays
          # readily available. Xcode's toolchain cross-links x86_64-apple-darwin
          # from an arm64 host natively, no extra setup needed.
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(cargo pkgid -p shilpi | sed -E 's/.*[#@]//')-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p shilpid -p shilpi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="shilpidb-${{ steps.tag.outputs.tag }}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/shilpid" "$stage/"
          cp "target/${{ matrix.target }}/release/shilpi" "$stage/"
          cp README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "shilpidb-${{ steps.tag.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\shilpid.exe" $stage
          Copy-Item "target\${{ matrix.target }}\release\shilpi.exe" $stage
          Copy-Item README.md,LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shilpidb-${{ matrix.target }}
          path: |
            shilpidb-*.tar.gz
            shilpidb-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
